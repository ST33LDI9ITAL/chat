<!DOCTYPE html>
<html>
<head><title>Nostr Test 2</title></head>
<body>
<h2>Nostr Cross-Browser Test (Same Room)</h2>
<p>Both windows use the SAME hardcoded room slug.</p>
<div id="status">Loading...</div>
<div id="log" style="white-space:pre-wrap;font-family:monospace;font-size:12px;margin-top:10px;"></div>
<hr>
<input id="msgInput" placeholder="Type message" style="width:300px">
<button id="sendBtn">Send</button>
<button id="checkBtn">Check for messages</button>

<script src="https://unpkg.com/nostr-tools@2.7.0/lib/nostr.bundle.js"></script>
<script>
// BOTH WINDOWS USE THIS SAME SLUG
const slug = 'cross_test_room_2026'
let myPubkey = ''
let receivedCount = 0

const relays = [
  'wss://relay.ditto.pub',
  'wss://purplerelay.com',
  'wss://relay.snort.social'
]

function log(msg) {
  document.getElementById('log').textContent += msg + '\n'
}

async function init() {
  const sk = window.NostrTools.generateSecretKey()
  myPubkey = window.NostrTools.getPublicKey(sk)
  log('My pubkey: ' + myPubkey.substring(0, 16))
  log('Room slug: ' + slug)

  document.getElementById('status').textContent = 'Room: ' + slug + ' | Pubkey: ' + myPubkey.substring(0, 8)

  relays.forEach(url => connectRelay(url, sk))
}

function connectRelay(url, sk) {
  const ws = new WebSocket(url)
  
  ws.onopen = () => {
    log('✅ Connected: ' + url)
    
    const filter = {
      kinds: [1],
      '#t': [slug],
      since: Math.floor(Date.now() / 1000) - 86400
    }
    ws.send(JSON.stringify(['REQ', 'test_sub', filter]))
    log('   Subscribed to #t: ' + slug)
  }
  
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data)
    if (msg[0] === 'EVENT' && msg[2]) {
      const ev = msg[2]
      const fromOther = ev.pubkey !== myPubkey
      log((fromOther ? '📩 FROM OTHER PEER' : '   own echo') + ' - ' + ev.pubkey.substring(0,8) + ': ' + ev.content.substring(0,50))
      if (fromOther) {
        receivedCount++
        document.getElementById('status').textContent = '✅ RECEIVED ' + receivedCount + ' messages from other peer!'
      }
    }
    if (msg[0] === 'EOSE') {
      log('   EOSE for ' + msg[1])
    }
    if (msg[0] === 'OK') {
      log('   OK: ' + (msg[2] ? 'accepted' : 'REJECTED'))
    }
  }
  
  ws.onerror = () => log('❌ Error: ' + url)
  ws.onclose = () => log('❌ Closed: ' + url)
  
  window._wsConnections = window._wsConnections || []
  window._wsConnections.push({ ws, sk, url })
}

document.getElementById('sendBtn').onclick = async () => {
  const text = document.getElementById('msgInput').value
  if (!text) return
  
  const eventTemplate = {
    kind: 1,
    created_at: Math.floor(Date.now() / 1000),
    tags: [['t', slug]],
    content: text
  }
  
  ;(window._wsConnections || []).forEach(({ ws, sk }) => {
    if (ws.readyState === WebSocket.OPEN) {
      const signed = window.NostrTools.finalizeEvent(eventTemplate, sk)
      ws.send(JSON.stringify(['EVENT', signed]))
      log('📤 Sent: ' + text)
    }
  })
}

// Manual poll button
document.getElementById('checkBtn').onclick = () => {
  const filter = { kinds: [1], '#t': [slug], since: Math.floor(Date.now() / 1000) - 60, limit: 50 }
  ;(window._wsConnections || []).forEach(({ ws }) => {
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(['REQ', 'poll_check', filter]))
      log('   Polling for messages...')
      setTimeout(() => ws.send(JSON.stringify(['CLOSE', 'poll_check'])), 2000)
    }
  })
}

init()
</script>
</body>
</html>
