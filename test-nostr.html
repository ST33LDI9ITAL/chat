<!DOCTYPE html>
<html>
<head><title>Nostr Test</title></head>
<body>
<h2>Nostr Publish/Subscribe Test</h2>
<p>Open this in two browser windows. Send a message from one, see if the other receives it.</p>
<div id="status">Loading...</div>
<div id="log" style="white-space:pre-wrap;font-family:monospace;font-size:12px;margin-top:10px;"></div>
<hr>
<input id="msgInput" placeholder="Type message" style="width:300px">
<button id="sendBtn">Send</button>

<script src="https://unpkg.com/nostr-tools@2.7.0/lib/nostr.bundle.js"></script>
<script>
const relays = [
  'wss://relay.ditto.pub',
  'wss://purplerelay.com',
  'wss://relay.snort.social'
]

const slug = 'test_' + Math.random().toString(36).substring(2, 10)
let myPubkey = ''

function log(msg) {
  document.getElementById('log').textContent += msg + '\n'
}

async function init() {
  // Generate key
  const sk = window.NostrTools.generateSecretKey()
  myPubkey = window.NostrTools.getPublicKey(sk)
  log('My pubkey: ' + myPubkey.substring(0, 16))
  log('Room slug: ' + slug)

  document.getElementById('status').textContent = 'Room: ' + slug + ' | Pubkey: ' + myPubkey.substring(0, 8)

  // Connect to relays
  relays.forEach(url => connectRelay(url, sk))
}

function connectRelay(url, sk) {
  const ws = new WebSocket(url)
  
  ws.onopen = () => {
    log('✅ Connected: ' + url)
    
    // Subscribe to our test room
    const filter = {
      kinds: [1],
      '#t': [slug],
      since: Math.floor(Date.now() / 1000) - 86400
    }
    ws.send(JSON.stringify(['REQ', 'test_sub', filter]))
    log('   Subscribed to #t: ' + slug)
  }
  
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data)
    if (msg[0] === 'EVENT' && msg[2]) {
      const ev = msg[2]
      log('📩 RECEIVED event from ' + ev.pubkey.substring(0, 8) + ': ' + ev.content.substring(0, 40))
      if (ev.pubkey !== myPubkey) {
        document.getElementById('status').textContent = '✅ GOT MESSAGE FROM OTHER PEER!'
      }
    }
    if (msg[0] === 'EOSE') {
      log('   EOSE for ' + msg[1])
    }
    if (msg[0] === 'OK') {
      log('   OK: ' + (msg[2] ? 'accepted' : 'REJECTED'))
    }
  }
  
  ws.onerror = () => log('❌ Error: ' + url)
  ws.onclose = () => log('❌ Closed: ' + url)
  
  // Store for sending
  window._wsConnections = window._wsConnections || []
  window._wsConnections.push({ ws, sk, url })
}

// Send a message
document.getElementById('sendBtn').onclick = async () => {
  const text = document.getElementById('msgInput').value
  if (!text) return
  
  const eventTemplate = {
    kind: 1,
    created_at: Math.floor(Date.now() / 1000),
    tags: [['t', slug]],
    content: text
  }
  
  ;(window._wsConnections || []).forEach(({ ws, sk }) => {
    if (ws.readyState === WebSocket.OPEN) {
      const signed = window.NostrTools.finalizeEvent(eventTemplate, sk)
      ws.send(JSON.stringify(['EVENT', signed]))
      log('📤 Sent to ' + ws.url.substring(0, 30) + ': ' + text)
    }
  })
}

init()
</script>
</body>
</html>
