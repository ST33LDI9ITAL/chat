name: Deploy Chat App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject ExpressTURN Secrets into index.html
        run: |
          EXPRESS_URL="${{ secrets.EXPRESS_TURN_URL }}"
          EXPRESS_USER="${{ secrets.EXPRESS_TURN_USER }}"
          EXPRESS_PASS="${{ secrets.EXPRESS_TURN_PASS }}"

          if [ -z "$EXPRESS_URL" ]; then EXPRESS_URL="turn:express.expressturn.com:443"; fi
          if [ -z "$EXPRESS_USER" ]; then EXPRESS_USER="expressturn"; fi
          if [ -z "$EXPRESS_PASS" ]; then EXPRESS_PASS="expressturn"; fi

          sed -i "s|%%EXPRESS_TURN_URL%%|${EXPRESS_URL}|g" index.html
          sed -i "s|%%EXPRESS_TURN_USER%%|${EXPRESS_USER}|g" index.html
          sed -i "s|%%EXPRESS_TURN_PASS%%|${EXPRESS_PASS}|g" index.html

          GIFBOX_KEY="${{ secrets.GIFBOX_API_KEY }}"
          if [ -z "$GIFBOX_KEY" ]; then GIFBOX_KEY=""; fi
          sed -i "s|%%GIFBOX_API_KEY%%|${GIFBOX_KEY}|g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
